$kind: http-request
url: "{{backend_url}}/shops/products?search={{search_term}}&page=1&per_page=24&web_visible=1"
method: GET
headers:
  Accept: application/json
queryParams:
  search: "{{search_term}}"
  page: "1"
  per_page: "24"
  web_visible: "1"
auth:
  type: bearer
  credentials:
    token: "{{service_token}}"
order: 8000
