$kind: http-request
url: "{{backend_url}}/login"
method: POST
headers:
  Accept: application/json
body:
  type: formdata
  content:
    - type: text
      key: login
      value: "{{shop_login}}"
    - type: text
      key: password
      value: "{{shop_password}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = pm.response.json();
      const t = j.token || (j.data && j.data.token) || j.access_token || (j.data && j.data.access_token);
      if (t) pm.environment.set("service_token", t); else console.warn("token field not found, check response body");
    language: text/javascript
order: 1000
